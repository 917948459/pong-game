<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Pong — 单文件版</title>
  <style>
    :root{
      --bg:#0b1220;
      --accent:#60a5fa;
      --text:#e6eef8;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto, "Helvetica Neue", Arial;background:linear-gradient(180deg,#07101a 0%, #0b1220 100%);color:var(--text);display:flex;align-items:center;justify-content:center}
    .container{width:880px;max-width:95%;text-align:center}
    h1{margin:6px 0 10px;font-weight:600;color:var(--accent)}
    .scoreboard{display:flex;justify-content:space-between;margin-bottom:8px;font-weight:600}
    #gameCanvas{display:block;margin:0 auto;background:linear-gradient(180deg,#072033,#051322);border:4px solid rgba(255,255,255,0.06);border-radius:6px;box-shadow:0 8px 30px rgba(2,6,23,0.7), inset 0 1px 0 rgba(255,255,255,0.02)}
    .controls{margin-top:10px;display:flex;align-items:center;gap:12px;justify-content:center}
    button{background:var(--accent);color:#052033;border:none;padding:10px 14px;border-radius:6px;cursor:pointer;font-weight:700}
    button:hover{opacity:0.95}
    .hint{color:rgba(230,238,248,0.7);font-size:0.95rem}
    footer{margin-top:10px;color:rgba(230,238,248,0.45);font-size:0.85rem}
    @media (max-width:520px){
      .container{padding:12px}
      #gameCanvas{width:100%;height:auto}
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Simple Pong</h1>
    <div class="scoreboard">
      <div id="playerScore">Player: 0</div>
      <div id="computerScore">Computer: 0</div>
    </div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <div class="controls">
      <button id="startBtn">Start / Restart</button>
      <div class="hint">Controls: Move mouse over the canvas, or use Arrow Up / Arrow Down. Space to pause.</div>
    </div>

    <footer>Created with HTML, CSS & JavaScript</footer>
  </div>

  <script>
  (function(){
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const playerScoreEl = document.getElementById('playerScore');
    const computerScoreEl = document.getElementById('computerScore');
    const startBtn = document.getElementById('startBtn');

    const W = canvas.width;
    const H = canvas.height;

    // Game objects
    const paddleWidth = 12;
    const paddleHeight = 100;
    const paddleMargin = 18;

    const player = {
      x: paddleMargin,
      y: (H - paddleHeight) / 2,
      width: paddleWidth,
      height: paddleHeight,
      speed: 6
    };

    const computer = {
      x: W - paddleMargin - paddleWidth,
      y: (H - paddleHeight) / 2,
      width: paddleWidth,
      height: paddleHeight,
      speed: 4 // AI max speed per frame
    };

    const ball = {
      x: W / 2,
      y: H / 2,
      r: 9,
      speed: 5,
      dx: 0,
      dy: 0
    };

    let playerScore = 0;
    let computerScore = 0;
    let running = false;

    // input state
    let upPressed = false;
    let downPressed = false;

    // utilities
    function resetBall(servingToPlayer = true) {
      ball.x = W / 2;
      ball.y = H / 2;
      ball.speed = 5;
      // random small angle
      const angle = (Math.random() * 0.6 - 0.3); // -0.3..0.3
      const dir = servingToPlayer ? -1 : 1;
      ball.dx = dir * ball.speed * Math.cos(angle);
      ball.dy = ball.speed * Math.sin(angle);
    }

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

    function rectangleCircleCollision(rect, circle) {
      // find closest point to circle center on rect
      const closestX = clamp(circle.x, rect.x, rect.x + rect.width);
      const closestY = clamp(circle.y, rect.y, rect.y + rect.height);
      const dx = circle.x - closestX;
      const dy = circle.y - closestY;
      return dx*dx + dy*dy <= circle.r * circle.r;
    }

    // draw
    function drawNet() {
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      const seg = 10, gap = 8, center = W/2;
      for (let y=10; y < H; y += seg + gap) {
        ctx.fillRect(center - 1, y, 2, seg);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      // subtle background
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0, 'rgba(255,255,255,0.02)');
      g.addColorStop(1, 'rgba(0,0,0,0.02)');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);

      // net
      drawNet();

      // paddles
      ctx.fillStyle = '#60a5fa';
      roundRect(ctx, player.x, player.y, player.width, player.height, 6);
      ctx.fillStyle = '#a78bfa';
      roundRect(ctx, computer.x, computer.y, computer.width, computer.height, 6);

      // ball
      ctx.beginPath();
      ctx.fillStyle = '#fef3c7';
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
      ctx.fill();
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      ctx.fill();
    }

    // update logic
    function update() {
      if (!running) return;

      // player movement from keys
      if (upPressed) player.y -= player.speed;
      if (downPressed) player.y += player.speed;

      // bounds
      player.y = clamp(player.y, 0, H - player.height);

      // simple AI: move towards ball position with limited speed
      if (computer.y + computer.height/2 < ball.y - 6) {
        computer.y += computer.speed;
      } else if (computer.y + computer.height/2 > ball.y + 6) {
        computer.y -= computer.speed;
      }
      computer.y = clamp(computer.y, 0, H - computer.height);

      // move ball
      ball.x += ball.dx;
      ball.y += ball.dy;

      // wall collision
      if (ball.y - ball.r <= 0) {
        ball.y = ball.r;
        ball.dy = -ball.dy;
      } else if (ball.y + ball.r >= H) {
        ball.y = H - ball.r;
        ball.dy = -ball.dy;
      }

      // paddle collisions
      const playerRect = {x: player.x, y: player.y, width: player.width, height: player.height};
      const computerRect = {x: computer.x, y: computer.y, width: computer.width, height: computer.height};

      if (rectangleCircleCollision(playerRect, ball) && ball.dx < 0) {
        // hit left paddle
        ball.x = player.x + player.width + ball.r + 0.5;
        handlePaddleBounce(player);
      } else if (rectangleCircleCollision(computerRect, ball) && ball.dx > 0) {
        // hit right paddle
        ball.x = computer.x - ball.r - 0.5;
        handlePaddleBounce(computer);
      }

      // out of bounds left/right -> score
      if (ball.x - ball.r <= 0) {
        // computer scores
        computerScore++;
        updateScores();
        running = false;
        setTimeout(()=>{ resetBall(false); running = true; }, 800);
      } else if (ball.x + ball.r >= W) {
        // player scores
        playerScore++;
        updateScores();
        running = false;
        setTimeout(()=>{ resetBall(true); running = true; }, 800);
      }
    }

    function handlePaddleBounce(paddle) {
      // reflect and adjust dy based on where it hit the paddle
      const relativeY = (ball.y - (paddle.y + paddle.height/2));
      const normalized = relativeY / (paddle.height/2); // -1..1
      const maxBounceAngle = Math.PI * 0.35; // ~63deg
      const bounceAngle = normalized * maxBounceAngle;
      const speed = Math.min(12, ball.speed * 1.06); // increase speed a little
      const dir = paddle === player ? 1 : -1;
      ball.dx = dir * Math.cos(bounceAngle) * speed;
      ball.dy = Math.sin(bounceAngle) * speed;
      ball.speed = speed;
    }

    function updateScores() {
      playerScoreEl.textContent = `Player: ${playerScore}`;
      computerScoreEl.textContent = `Computer: ${computerScore}`;
    }

    // game loop
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // input handlers
    function onMouseMove(e) {
      const rect = canvas.getBoundingClientRect();
      const y = e.clientY - rect.top;
      // center paddle on mouse y
      player.y = clamp(y - player.height / 2, 0, H - player.height);
    }

    function onTouchMove(e) {
      if (!e.touches || e.touches.length === 0) return;
      const rect = canvas.getBoundingClientRect();
      const y = e.touches[0].clientY - rect.top;
      player.y = clamp(y - player.height / 2, 0, H - player.height);
      e.preventDefault();
    }

    function onKeyDown(e) {
      if (e.key === 'ArrowUp') { upPressed = true; e.preventDefault(); }
      if (e.key === 'ArrowDown') { downPressed = true; e.preventDefault(); }
      // Support both e.code and e.key for space
      if (e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar') {
        running = !running;
        e.preventDefault();
      }
    }
    function onKeyUp(e) {
      if (e.key === 'ArrowUp') upPressed = false;
      if (e.key === 'ArrowDown') downPressed = false;
    }

    // start / restart
    startBtn.addEventListener('click', () => {
      playerScore = 0;
      computerScore = 0;
      updateScores();
      resetBall(Math.random() > 0.5);
      running = true;
    });

    // allow click on canvas to (re)start
    canvas.addEventListener('click', () => {
      if (!running) {
        resetBall(Math.random() > 0.5);
        running = true;
      }
    });

    // init
    function init() {
      updateScores();
      resetBall(Math.random() > 0.5);
      // events
      canvas.addEventListener('mousemove', onMouseMove);
      canvas.addEventListener('touchmove', onTouchMove, {passive:false});
      window.addEventListener('keydown', onKeyDown);
      window.addEventListener('keyup', onKeyUp);

      ctx.imageSmoothingEnabled = true;
      requestAnimationFrame(loop);
    }

    init();
  })();
  </script>
</body>
</html>
